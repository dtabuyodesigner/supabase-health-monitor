name: Read-only database availability

on:
  schedule:
    - cron: '17 9 * * *'
  push:
    branches: [main]
    paths: [dispatch/request.json]
  workflow_dispatch:

permissions:
  contents: write # Record one monthly health report in this dedicated repository.

concurrency:
  group: database-availability
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check each configured read-only RPC three times
        env:
          SUPABASE_PROJECTS_JSON: ${{ secrets.SUPABASE_PROJECTS_JSON }}
        run: python3 scripts/healthcheck.py --status-file /tmp/monitor-status.json
      - name: Record a monthly report and keep the schedule active
        shell: bash
        run: |
          set -euo pipefail
          month="$(date -u +%Y-%m)"
          previous="$(cat reports/latest-month.txt 2>/dev/null || true)"
          count="$(python3 -c 'import json; print(len(json.load(open("/tmp/monitor-status.json"))["projects"]))')"
          previous_count="$(python3 -c 'import json,pathlib; p=pathlib.Path("reports/latest-check.json"); print(json.loads(p.read_text()).get("project_count",0) if p.exists() else 0)')"
          if [ "$month" != "$previous" ] || [ "$count" != "$previous_count" ]; then
            mkdir -p reports
            python3 -c 'import json; d=json.load(open("/tmp/monitor-status.json")); json.dump({"checked_at":d["checked_at"],"ok":d["ok"],"project_count":len(d["projects"])},open("reports/latest-check.json","w"),sort_keys=True)'
            printf '%s\n' "$month" > reports/latest-month.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add reports/latest-check.json reports/latest-month.txt
            git commit -m "docs: record monthly database availability check"
            git push origin HEAD:main
          fi
