name: Read-only database availability

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: write # Record one monthly health report in this dedicated repository.

concurrency:
  group: database-availability
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check the read-only RPC three times
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: python3 scripts/healthcheck.py --status-file /tmp/monitor-status.json
      - name: Record a monthly report and keep the schedule active
        shell: bash
        run: |
          set -euo pipefail
          month="$(date -u +%Y-%m)"
          previous="$(cat reports/latest-month.txt 2>/dev/null || true)"
          if [ "$month" != "$previous" ]; then
            mkdir -p reports
            cp /tmp/monitor-status.json reports/latest-check.json
            printf '%s\n' "$month" > reports/latest-month.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add reports/latest-check.json reports/latest-month.txt
            git commit -m "docs: record monthly database availability check"
            git push origin HEAD:main
          fi
